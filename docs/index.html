<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="7o5 Tea">
  <meta name="theme-color" content="#E8192C">
  <title>Club 7o5 Tea</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Main App ── -->
<div id="main-app">
  <div id="screens-wrap">
    <div id="screen-home"     class="screen"></div>
    <div id="screen-log"      class="screen hidden"></div>
    <div id="screen-payments" class="screen hidden"></div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="log" onclick="switchTab('log')">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5C3.9 4 3 4.9 3 6v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      <span>Daily Log</span>
    </button>
    <button class="nav-item" data-tab="payments" onclick="switchTab('payments')">
      <svg viewBox="0 0 24 24"><text x="12" y="19" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" font-family="-apple-system,BlinkMacSystemFont,sans-serif">₹</text></svg>
      <span>Payments</span>
    </button>
  </nav>
</div>

<!-- ── Modal ── -->
<div id="modal" class="modal-bg hidden" onclick="bgClose(event)">
  <div class="modal-card" id="modal-card"></div>
</div>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
